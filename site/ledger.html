<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9545759448534604" crossorigin="anonymous"></script>
<title>Ledger · 5050 Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Silkscreen:wght@700&display=swap">
<style>
  :root { --bg: #161615; --surface: #222221; --ink: #ECEAE4; --muted: #A5A29B; --rule: #3B3A37; --accent: #FF8B2E; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --bg: #EDEBE6; --surface: #FAF9F6; --ink: #1A1A1A; --muted: #5F5D58; --rule: #C6C3BC; --accent: #B84A00; color-scheme: light; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; font-size: 16px; line-height: 1.5; padding: 0 max(16px, env(safe-area-inset-left)) 48px max(16px, env(safe-area-inset-right)); }
  .wrap { max-width: 640px; margin: 0 auto; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); margin-bottom: 24px; }
  .wm { font-family: Silkscreen, monospace; font-size: 20px; color: var(--ink); text-decoration: none; }
  .wm b { color: var(--accent); }
  .meta { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  h1 { font-size: 28px; margin: 0 0 4px; }
  h2 { font-size: 13px; font-family: "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
  .pots { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .receipt { background: var(--surface); border: 1px solid var(--rule); padding: 12px; font-family: "IBM Plex Mono", monospace; font-size: 13px; font-variant-numeric: tabular-nums; }
  .receipt .g { font-family: "Atkinson Hyperlegible Next", sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .row { display: flex; gap: 6px; align-items: baseline; }
  .row .k { color: var(--muted); white-space: nowrap; }
  .row .d { flex: 1; border-bottom: 1px dotted var(--rule); transform: translateY(-4px); }
  .row.total { border-top: 1px solid var(--ink); margin-top: 6px; padding-top: 6px; font-weight: 600; font-size: 15px; }
  .row.total .k { color: var(--ink); }
  .stamp { display: inline-block; border: 1px dashed var(--muted); color: var(--muted); padding: 0 5px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-family: "IBM Plex Mono", monospace; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--rule); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  td.amt, th.amt { text-align: right; }
  .empty { color: var(--muted); padding: 12px 6px; }
  td.amt.neg { color: #D9534F; }
  .tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--rule); padding: 0 5px; color: var(--muted); }
  .tag.top { color: var(--accent); border-color: var(--accent); }
  .now { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .now div { background: var(--surface); border: 1px solid var(--rule); padding: 10px 12px; }
  .now b { display: block; font-family: "IBM Plex Mono", monospace; font-size: 22px; font-variant-numeric: tabular-nums; }
  .now span { font-size: 12px; color: var(--muted); }
  @media (max-width: 420px) { .now { grid-template-columns: 1fr; } }
  p { max-width: 62ch; color: var(--muted); font-size: 14px; }
  .foot { margin-top: 36px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .foot a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="wm" href="/">50<b>/</b>50</a><span class="meta" id="wk">ledger</span></div>
  <h1>Ledger</h1>
  <p>Two lists. What's in the pot and how it got there, and who's been playing. Nothing else.</p>

  <h2>Pot</h2>
  <div class="now" id="now"></div>
  <table>
    <thead><tr><th>date</th><th>what</th><th>game</th><th class="amt">to the pot</th></tr></thead>
    <tbody id="log"><tr><td colspan="4" class="empty">loading…</td></tr></tbody>
  </table>

  <h2>Plays</h2>
  <table>
    <thead><tr><th>when</th><th>who</th><th>game</th><th class="amt">score</th></tr></thead>
    <tbody id="plays"><tr><td colspan="4" class="empty">loading…</td></tr></tbody>
  </table>

  <div class="foot"><a href="/">home</a><a href="/rules">rules</a><a href="/privacy">privacy</a><span>play@play5050games.com</span></div>
</div>
<script>
(async () => {
  const $ = (c) => (c < 0 ? "-" : "") + "$" + (Math.abs(c) / 100).toFixed(2);
  const names = { pigeon: "Drunk Pigeon", rent: "Rent's Due", slumlord: "Slumlord", all: "all three" };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const kinds = { ads: "ad revenue", merch: "merch profit", seed: "seed (Harrison)", rollover: "rollover", payout: "paid out", note: "" };
  const toPot = (e) => { const base = e.game === "all" ? e.cents : e.cents; if (e.kind === "ads" || e.kind === "merch") return Math.floor(base / 2); if (e.kind === "seed" || e.kind === "rollover") return base; if (e.kind === "payout") return -base; return 0; };
  try {
    const j = await (await fetch("/api/pots")).json();
    document.getElementById("wk").textContent = "ledger · " + j.week;
    document.getElementById("now").innerHTML = ["pigeon", "rent", "slumlord"].map((g) => `<div><b>${$(j.pots[g].est_pot_cents)}</b><span>${names[g]} · seed ${$(j.pots[g].seed_cents)}</span></div>`).join("");
    const rows = j.entries.map((e) => {
      const p = toPot(e); const what = e.kind === "note" ? esc(e.note || "") : `${kinds[e.kind] || esc(e.kind)}${e.note ? " · " + esc(e.note) : ""}${(e.kind === "ads" || e.kind === "merch") ? ` <span class="tag">half of ${$(e.cents)}</span>` : ""}`;
      return `<tr><td>${esc(e.date)}</td><td>${what}</td><td>${names[e.game] || esc(e.game)}</td><td class="amt ${p < 0 ? "neg" : ""}">${e.kind === "note" ? "" : (p > 0 ? "+" : "") + $(p)}</td></tr>`;
    });
    document.getElementById("log").innerHTML = rows.join("") || `<tr><td colspan="4" class="empty">Nothing yet.</td></tr>`;
  } catch { document.getElementById("log").innerHTML = `<tr><td colspan="4" class="empty">Couldn't load the pot log.</td></tr>`; }
  try {
    const j = await (await fetch("/api/plays")).json();
    const when = (iso) => { const d = new Date(iso); const m = (Date.now() - d) / 60000; if (m < 1) return "just now"; if (m < 60) return Math.floor(m) + "m ago"; if (m < 1440) return Math.floor(m / 60) + "h ago"; return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
    const rows = j.plays.map((p) => `<tr><td>${when(p.at)}</td><td>${esc(p.handle)}${p.rank ? ` <span class="tag top">#${p.rank}</span>` : ""}</td><td>${names[p.game] || esc(p.game)}</td><td class="amt">${p.score}</td></tr>`);
    document.getElementById("plays").innerHTML = rows.join("") || `<tr><td colspan="4" class="empty">Nobody has played ranked this week. Technically, zero is winning.</td></tr>`;
  } catch { document.getElementById("plays").innerHTML = `<tr><td colspan="4" class="empty">Couldn't load plays.</td></tr>`; }
})();
</script>
</body>
</html>
